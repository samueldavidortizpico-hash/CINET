# Auditoría H-10: puerta de despliegue. Vercel publica cada despliegue (preview y producción) como
# deployment_status en GitHub; este job corre scripts/smoke.mjs contra la URL REAL de ese despliegue.
# Para que bloquee la promoción: Vercel > Settings > Deployment Checks → exigir el check «smoke».
# Rollback: Vercel > Deployments > (último despliegue sano) > Instant Rollback. Ver docs/DESPLIEGUE-Y-ROLLBACK.md.
name: Deploy smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: URL del despliegue a comprobar (https://…)
        required: true

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Smoke HTTP (cabeceras, 404 real, API con 401/405/415, TMDB, HTTPS)
        env:
          SMOKE_URL: ${{ github.event.deployment_status.environment_url || inputs.url }}
          # Solo si el preview tiene Vercel Authentication. Nunca se imprime.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # CSV o JSON de orígenes HTTPS exactos controlados por el equipo. No usar *.vercel.app.
          # Si hay secreto y el evento apunta fuera de esta lista, el script aborta sin llamar a la red.
          SMOKE_TRUSTED_ORIGINS: ${{ vars.SMOKE_TRUSTED_ORIGINS }}
        run: node scripts/smoke.mjs "$SMOKE_URL"
